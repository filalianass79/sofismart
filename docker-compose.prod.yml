# DEPRECATED — Utiliser docker-compose.yml (AWS Lightsail)
# Ce fichier est conservé pour compatibilité :
#   docker compose -f docker-compose.prod.yml up -d
# Équivalent :
#   docker compose --env-file .env.production up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sofismart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-sofismart}
    volumes:
      - sofismart_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sofismart_user} -d ${POSTGRES_DB:-sofismart}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        AUTH_SECRET: ${AUTH_SECRET}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET}}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        APP_URL: ${APP_URL}
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sofismart_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sofismart}?schema=public
      NODE_ENV: production
    volumes:
      - sofismart_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  sofismart_pg_data:
  sofismart_uploads:
