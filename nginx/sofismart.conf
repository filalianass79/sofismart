# SOFISMART — Nginx reverse proxy (AWS Lightsail Ubuntu)
# Installation :
#   sudo cp nginx/sofismart.conf /etc/nginx/sites-available/sofismart
#   sudo ln -sf /etc/nginx/sites-available/sofismart /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL : sudo certbot --nginx -d app.sofismart.com

upstream sofismart_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirection HTTP → HTTPS (activer après Certbot ou manuellement)
server {
    listen 80;
    listen [::]:80;
    server_name app.sofismart.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.sofismart.com;

    # Certificats Let's Encrypt (générés par Certbot)
    ssl_certificate     /etc/letsencrypt/live/app.sofismart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sofismart.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/sofismart.access.log;
    error_log  /var/log/nginx/sofismart.error.log;

    # Uploads jusqu'à 50 Mo
    client_max_body_size 50M;
    client_body_timeout 120s;

    # Headers sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Fichiers uploadés servis par Next.js (proxy)
    location /uploads/ {
        proxy_pass http://sofismart_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }

    # Webhook WhatsApp Meta (public, sans auth middleware côté app)
    location /api/whatsapp/webhook {
        proxy_pass http://sofismart_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Application Next.js
    location / {
        proxy_pass http://sofismart_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
